<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Hệ Thống Quản Lý Xác Hiến</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0d6efd, #0dcaf0);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <i class="fa-solid fa-user-shield text-primary fa-3x mb-2"></i>
            <h3 class="fw-bold text-primary">ĐĂNG NHẬP HỆ THỐNG</h3>
            <p class="text-muted small">Trung tâm Giải Phẫu học - Phẫu thuật thực nghiệm</p>
        </div>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label fw-bold">Tên đăng nhập</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control" id="username" required placeholder="Nhập tên đăng nhập...">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control" id="password" required placeholder="Nhập mật khẩu...">
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="loginBtn">Đăng Nhập</button>
            <div id="errorMsg" class="text-danger text-center mt-3 small" style="display: none;">
                Sai tên đăng nhập hoặc mật khẩu!
            </div>
        </form>
    </div>

    <script>
        // DÁN WEB APP URL CỦA THẦY VÀO ĐÂY
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFsJ9GHvepEb-jz5b4H-UWcrmql-kjwATP5Y2fD-vbMNOV3fyQ_CE9YSGspvAEbS7fsg/exec"; 

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMsg');
            btn.innerHTML = "Đang kiểm tra...";
            btn.disabled = true;
            errorMsg.style.display = 'none';

            let payload = {
                action: "login",
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value.trim()
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(result => {
                if (result.result === "success") {
                    // Đăng nhập thành công, lưu trạng thái vào trình duyệt
                    sessionStorage.setItem('isLoggedIn', 'true');
                    window.location.href = 'index.html'; // Chuyển về trang chủ
                } else {
                    errorMsg.style.display = 'block';
                    btn.innerHTML = "Đăng Nhập";
                    btn.disabled = false;
                }
            })
            .catch(error => {
                console.error(error);
                alert("Lỗi kết nối hệ thống!");
                btn.innerHTML = "Đăng Nhập";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
