<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Đăng Ký Hiến Xác</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f7f6; }
        #loading { display: flex; justify-content: center; align-items: center; height: 150px; flex-direction: column; }
        .table th, .table td { vertical-align: middle; }
    </style>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        } else {
            const role = sessionStorage.getItem('userRole');
            if (role !== 'admin' && role !== 'dangky') { alert("Tài khoản của bạn không được cấp quyền truy cập!"); window.location.href = 'index.html'; }
        }
    </script>

    <div class="container mt-4 mb-5">
        <a href="index.html" class="btn btn-outline-secondary mb-4"><i class="fa-solid fa-arrow-left"></i> Về trang chủ</a>
        <h2 class="text-center mb-4 text-success fw-bold">TRA CỨU & QUẢN LÝ HỒ SƠ ĐĂNG KÝ</h2>

        <div class="card shadow-sm p-4 mb-4 border-success border-top border-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <select id="searchCriteria" class="form-select border-success text-success fw-bold">
                        <option value="all">Tìm tất cả</option>
                        <option value="hoTen">Theo Họ và Tên</option>
                        <option value="maSoHoSo">Theo Mã hồ sơ</option>
                        <option value="canCuoc">Theo CCCD</option>
                    </select>
                </div>
                <div class="col-md-9">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-success text-success"><i class="fa-solid fa-search"></i></span>
                        <input type="text" id="searchInput" class="form-control border-success" placeholder="Nhập tên, mã hồ sơ hoặc số CCCD...">
                        <button class="btn btn-success px-4 fw-bold" type="button" id="btnSearch">Tìm kiếm</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trạng thái chờ tải ngầm -->
        <div id="loading">
            <div class="spinner-border text-success mb-3" role="status" style="width: 3rem; height: 3rem;"></div>
            <h5 class="text-muted" id="loadingText">Đang tải dữ liệu từ hệ thống...</h5>
        </div>

        <!-- Thông báo sẵn sàng tra cứu (Mới thêm) -->
        <div id="readyMessage" class="text-center text-primary mt-5" style="display: none;">
            <h4><i class="fa-solid fa-keyboard fa-bounce"></i> Hệ thống đã sẵn sàng. Vui lòng nhập từ khóa để tra cứu!</h4>
        </div>
        
        <div id="tableContainer" class="card shadow-sm" style="display: none;">
            <div class="table-responsive">
                <table class="table table-hover table-striped mb-0">
                    <thead class="table-success">
                        <tr>
                            <th scope="col" class="text-center">Mã HS</th>
                            <th scope="col">Họ và tên</th>
                            <th scope="col">CCCD</th>
                            <th scope="col" class="text-center">Năm sinh</th>
                            <th scope="col" class="text-center">Giới tính</th>
                            <th scope="col" class="text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="resultsArea"></tbody>
                </table>
            </div>
        </div>

        <div id="noResult" class="text-center text-danger mt-5" style="display: none;">
            <h4><i class="fa-solid fa-circle-exclamation"></i> Không tìm thấy hồ sơ đăng ký nào.</h4>
        </div>
    </div>

    <!-- Modal Sửa Thông Tin (Giữ nguyên) -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="editForm">
                    <div class="modal-header bg-success text-white">
                        <h5 class="modal-title"><i class="fa-solid fa-pen-to-square"></i> Cập nhật hồ sơ đăng ký</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editRowNumber">
                        <input type="hidden" id="editOldLinkFile">
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label fw-bold">Mã hồ sơ</label><input type="text" class="form-control" id="editMaSoHoSo" required></div>
                            <div class="col-md-8 mb-3"><label class="form-label fw-bold">Họ và tên</label><input type="text" class="form-control" id="editHoTen" required></div>
                            
                            <div class="col-md-4 mb-3"><label class="form-label fw-bold">Năm sinh</label><input type="number" class="form-control" id="editNgaySinh" required></div>
                            
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Giới tính</label>
                                <select class="form-select" id="editGioiTinh" required><option value="Nam">Nam</option><option value="Nữ">Nữ</option></select>
                            </div>
                            <div class="col-md-4 mb-3"><label class="form-label fw-bold">Ngày đăng ký</label><input type="date" class="form-control" id="editNgayDangKy" required></div>
                            
                            <div class="col-md-6 mb-3"><label class="form-label fw-bold">Căn cước công dân</label><input type="text" class="form-control" id="editCanCuoc"></div>
                            <div class="col-md-6 mb-3"><label class="form-label fw-bold">Ngày cấp</label><input type="date" class="form-control" id="editNgayCap"></div>

                            <div class="col-md-12 mb-3"><label class="form-label fw-bold">Địa chỉ</label><input type="text" class="form-control" id="editDiaChi"></div>
                            
                            <h6 class="text-success mt-2 border-bottom pb-2"><i class="fa-solid fa-phone"></i> Liên hệ</h6>
                            <div class="col-md-4 mb-3"><label class="form-label fw-bold">SĐT cá nhân</label><input type="text" class="form-control" id="editSdtCaNhan"></div>
                            <div class="col-md-4 mb-3"><label class="form-label fw-bold">SĐT người thân</label><input type="text" class="form-control" id="editSdtNguoiThan"></div>
                            <div class="col-md-4 mb-3"><label class="form-label fw-bold">Quan hệ</label><input type="text" class="form-control" id="editQuanHe"></div>
                            <div class="col-md-12 mb-3"><label class="form-label fw-bold">Tải lại Đơn PDF (Bỏ trống nếu giữ nguyên)</label><input type="file" class="form-control border-success" id="editFilePdf" accept="application/pdf"></div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="submit" class="btn btn-success" id="btnSaveEdit">Lưu Thay Đổi</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // DÁN URL ỨNG DỤNG WEB CỦA THẦY VÀO ĐÂY
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFsJ9GHvepEb-jz5b4H-UWcrmql-kjwATP5Y2fD-vbMNOV3fyQ_CE9YSGspvAEbS7fsg/exec"; 
        
        let allData = [];
        let editModal;

        document.addEventListener("DOMContentLoaded", () => {
            editModal = new bootstrap.Modal(document.getElementById('editModal'));
            loadData();
        });

        function loadData() {
            const loadingDiv = document.getElementById('loading');
            loadingDiv.style.display = 'flex'; 
            document.getElementById('tableContainer').style.display = 'none';
            document.getElementById('readyMessage').style.display = 'none';
            document.getElementById('noResult').style.display = 'none';

            fetch(SCRIPT_URL + "?sheet=DangKy_HienXac")
                .then(response => response.json())
                .then(data => { 
                    allData = data.reverse(); 
                    loadingDiv.style.display = 'none'; 
                    
                    // CHỈ HIỆN THÔNG BÁO SẴN SÀNG TRA CỨU MÀ KHÔNG RENDER DỮ LIỆU
                    document.getElementById('readyMessage').style.display = 'block'; 
                })
                .catch(error => { loadingDiv.innerHTML = `<h4 class="text-danger">Lỗi kết nối dữ liệu!</h4>`; });
        }

        function renderData(dataList) {
            const resultsArea = document.getElementById('resultsArea'); 
            const noResult = document.getElementById('noResult');
            resultsArea.innerHTML = '';
            
            if (dataList.length === 0) { 
                noResult.style.display = 'block'; 
                document.getElementById('tableContainer').style.display = 'none'; 
                return; 
            } 
            else { 
                noResult.style.display = 'none'; 
                document.getElementById('tableContainer').style.display = 'block'; 
            }

            dataList.forEach(item => {
                let pdfButton = item.linkFile && item.linkFile.includes("http") 
                    ? `<a href="${item.linkFile}" target="_blank" class="btn btn-sm btn-outline-success" title="Xem PDF"><i class="fa-solid fa-file-pdf"></i></a>` 
                    : `<button class="btn btn-sm btn-secondary" style="opacity: 0.3; cursor: not-allowed;" title="Không có file đính kèm" disabled><i class="fa-solid fa-file-pdf"></i></button>`;
                let warningBadge = item.daHien ? `<span class="badge bg-danger ms-2" title="Xác đã hiến tại Bộ môn"><i class="fa-solid fa-triangle-exclamation"></i> ĐÃ HIẾN</span>` : ``;
                const itemData = encodeURIComponent(JSON.stringify(item));

                const rowHTML = `
                    <tr>
                        <td class="text-center fw-bold text-secondary align-middle">${item.maSoHoSo}</td>
                        <td class="fw-bold text-success align-middle">${item.hoTen} ${warningBadge}</td>
                        <td class="align-middle">${item.canCuoc || '-'}</td>
                        <td class="text-center align-middle">${item.ngaySinh || '-'}</td>
                        <td class="text-center align-middle">${item.gioiTinh || '-'}</td>
                        <td class="align-middle">
                            <div class="d-flex justify-content-center gap-2">
                                ${pdfButton}
                                <button class="btn btn-sm btn-warning" onclick="openEditModal('${itemData}')" title="Sửa hồ sơ"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="btn btn-sm btn-danger" onclick="deleteRecord(${item.rowNumber}, '${item.hoTen}')" title="Xóa hồ sơ"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </td>
                    </tr>
                `;
                resultsArea.innerHTML += rowHTML;
            });
        }

        // TÌM KIẾM ĐÃ ĐƯỢC CHỈNH SỬA
        function filterData() {
            const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
            
            // Nếu ô tìm kiếm để trống thì nhắc nhở và không render gì cả
            if (keyword === "") {
                alert("Vui lòng nhập từ khóa (Tên, Mã hồ sơ hoặc CCCD) trước khi tìm kiếm!");
                return;
            }

            // Ẩn thông báo sẵn sàng
            document.getElementById('readyMessage').style.display = 'none';

            const criteria = document.getElementById('searchCriteria').value;
            const filteredData = allData.filter(item => {
                const hoTenStr = (item.hoTen || '').toLowerCase();
                const maSoHoSoStr = (item.maSoHoSo || '').toLowerCase();
                const canCuocStr = (item.canCuoc || '').toLowerCase();
                
                if (criteria === 'all') return hoTenStr.includes(keyword) || maSoHoSoStr.includes(keyword) || canCuocStr.includes(keyword);
                if (criteria === 'hoTen') return hoTenStr.includes(keyword);
                if (criteria === 'maSoHoSo') return maSoHoSoStr.includes(keyword);
                if (criteria === 'canCuoc') return canCuocStr.includes(keyword);
            });
            renderData(filteredData);
        }

        document.getElementById('btnSearch').addEventListener('click', filterData);
        document.getElementById('searchInput').addEventListener('keypress', function(e) { if (e.key === 'Enter') filterData(); });

        function parseDateForInput(dateString) {
            if (!dateString) return "";
            let cleanDate = dateString.replace("'", "");
            const parts = cleanDate.split('/');
            if (parts.length === 3) return `${parts[2]}-${parts[1].padStart(2, '0')}-${parts[0].padStart(2, '0')}`;
            return cleanDate;
        }

        function formatDateToVN(dateString) {
            if (!dateString) return "";
            const parts = dateString.split('-');
            if (parts.length === 3) return `'${parts[2]}/${parts[1]}/${parts[0]}`; 
            return dateString;
        }

        function deleteRecord(rowNumber, hoTen) {
            if (confirm(`⚠️ CẢNH BÁO:\nBạn có chắc chắn muốn XÓA hồ sơ đăng ký của "${hoTen}" không?`)) {
                const loadingDiv = document.getElementById('loading'); loadingDiv.style.display = 'flex'; 
                document.getElementById('tableContainer').style.display = 'none';
                document.getElementById('readyMessage').style.display = 'none';
                
                let payload = { action: "delete", sheetName: "DangKy_HienXac", rowNumber: rowNumber };
                fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
                .then(response => response.json())
                .then(result => { alert("Đã xóa thành công!"); loadData(); })
                .catch(error => { alert("Có lỗi xảy ra khi xóa!"); loadData(); });
            }
        }

        function openEditModal(itemDataStr) {
            const item = JSON.parse(decodeURIComponent(itemDataStr));
            document.getElementById('editRowNumber').value = item.rowNumber;
            document.getElementById('editOldLinkFile').value = item.linkFile || "";
            document.getElementById('editMaSoHoSo').value = item.maSoHoSo;
            document.getElementById('editHoTen').value = item.hoTen;
            
            let namSinhHienTai = item.ngaySinh || "";
            let cleanDate = namSinhHienTai.replace("'", ""); 
            if (cleanDate.includes('/')) {
                let parts = cleanDate.split('/'); namSinhHienTai = parts[2]; 
            } else if (cleanDate.includes('-')) {
                let parts = cleanDate.split('-'); namSinhHienTai = parts[0];
            }
            document.getElementById('editNgaySinh').value = namSinhHienTai;

            document.getElementById('editGioiTinh').value = item.gioiTinh;
            document.getElementById('editNgayDangKy').value = parseDateForInput(item.ngayDangKy);
            document.getElementById('editDiaChi').value = item.diaChi;
            document.getElementById('editSdtCaNhan').value = item.sdtCaNhan;
            document.getElementById('editSdtNguoiThan').value = item.sdtNguoiThan;
            document.getElementById('editQuanHe').value = item.quanHe;
            document.getElementById('editCanCuoc').value = item.canCuoc || "";
            document.getElementById('editNgayCap').value = parseDateForInput(item.ngayCap);
            document.getElementById('editFilePdf').value = ""; 
            editModal.show();
        }

        function getBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = () => resolve(reader.result); reader.onerror = error => reject(error);
            });
        }

        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!confirm("XÁC NHẬN:\nBạn có chắc chắn muốn LƯU CÁC THAY ĐỔI?")) return; 

            const btn = document.getElementById('btnSaveEdit'); btn.innerHTML = "Đang lưu..."; btn.disabled = true;

            let payload = {
                action: "update",
                sheetName: "DangKy_HienXac",
                rowNumber: document.getElementById('editRowNumber').value,
                oldLinkFile: document.getElementById('editOldLinkFile').value,
                maSoHoSo: document.getElementById('editMaSoHoSo').value,
                hoTen: document.getElementById('editHoTen').value,
                ngaySinh: document.getElementById('editNgaySinh').value,
                gioiTinh: document.getElementById('editGioiTinh').value,
                diaChi: document.getElementById('editDiaChi').value,
                sdtCaNhan: document.getElementById('editSdtCaNhan').value,
                sdtNguoiThan: document.getElementById('editSdtNguoiThan').value,
                quanHe: document.getElementById('editQuanHe').value,
                ngayDangKy: formatDateToVN(document.getElementById('editNgayDangKy').value),
                canCuoc: document.getElementById('editCanCuoc').value,
                ngayCap: formatDateToVN(document.getElementById('editNgayCap').value)
            };

            const fileInput = document.getElementById('editFilePdf');
            if (fileInput.files.length > 0) {
                const file = fileInput.files[0];
                if (file.type !== "application/pdf" || file.size > 5 * 1024 * 1024) {
                    alert("Tải lên file PDF hợp lệ dưới 5MB."); btn.innerHTML = "Lưu Thay Đổi"; btn.disabled = false; return;
                }
                payload.base64Data = await getBase64(file); payload.fileName = file.name; payload.mimeType = file.type;
            }

            fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
            .then(response => response.json())
            .then(result => { 
                alert("Cập nhật thành công!"); editModal.hide(); btn.innerHTML = "Lưu Thay Đổi"; btn.disabled = false; 
                
                // Thay vì hiển thị toàn bộ data sau khi lưu, sẽ đưa về trạng thái rỗng
                document.getElementById('tableContainer').style.display = 'none';
                loadData(); 
            })
            .catch(error => { alert("Lỗi khi cập nhật!"); btn.innerHTML = "Lưu Thay Đổi"; btn.disabled = false; });
        });
    </script>
</body>
</html>
